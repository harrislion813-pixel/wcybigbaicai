# ============================================================
# 大白菜叶色表型提取 — 全局配置文件
# ============================================================

# ---------- 输入输出路径 ----------
input:
  image_dir: "./data/raw_images/"          # 原始图像目录
  colorchecker_dir: "./data/colorchecker/"  # 色卡参考图像目录
  output_dir: "./output/"                   # 结果输出目录
  model_dir: "./models/"                    # 预训练模型目录

# ---------- 成像参数 ----------
imaging:
  camera_id: ""                 # 使用颜色 Profile 时必须与 Profile 完全一致
  color_space: "sRGB"           # 目标颜色空间
  white_balance: "none"         # RAW 默认使用相机白平衡；跨批次优先使用统一灰卡增益
  raw_use_camera_wb: true        # RAW 解码时使用相机记录的白平衡
  exposure_normalization: "fixed_capture"  # Profile 必须与本项一致
  target_illuminant: "D65"      # CIELAB/sRGB 参考光源
  # gray_card_rgb: [0.5, 0.5, 0.5]  # gray_card 模式必填，范围 [0,1]
  bits_per_channel: 16          # 输出位深 (8/16)

# ---------- 颜色校准 (X-Rite ColorChecker 24) ----------
color_calibration:
  # 默认关闭最安全；试运行可用 optional，正式跨批次分析使用 required。
  mode: "off"                   # off | optional | required
  profile_file: ""              # 推荐使用带版本、验证结果和哈希的 .ccm.json
  allow_legacy_matrix: false     # 裸 .npy/.csv 矩阵不能用于正式分析

# ---------- 叶片分割参数 ----------
segmentation:
  method: "auto"                # auto | unet | grabcut | exg_threshold | sam
  component_policy: "largest"   # largest | all；largest 取面积最大的植被候选域
  component_min_exg: 0.30       # 植被候选连通域的最小归一化 ExG
  max_processing_dimension: 2200  # 分割缩略图最长边；颜色仍按原图统计
  normalize_illumination: true   # 仅为分割做灰度世界归一化，不改变量化色值
  exclude_white_tissue: true     # 去除叶片内部低饱和度的白色叶柄、主脉
  white_tissue_max_saturation: 0.25  # HSV 饱和度不高于此值时视为白色候选
  white_tissue_min_retained_fraction: 0.50  # 至少保留一半叶片，否则回退原掩膜
  unet_model: "models/unet_efficientnet_b3.pth"
  device: "cpu"                 # cuda | cpu
  # 传统方法参数
  exg_threshold: 0.15           # 超绿指数阈值 (method=exg_threshold)
  grabcut_iterations: 5         # GrabCut迭代次数 (method=grabcut)
  # 形态学后处理
  morph_kernel_size: 5          # 开/闭运算核大小
  min_leaf_area_ratio: 0.002    # 最小叶片面积占比；远景小叶片建议从0.2%开始
  exclude_border_components: true  # 去除接触画面边缘的标尺、背景等大连通域
  border_margin_ratio: 0.01     # 边缘排除带宽，占图像宽高的比例

# ---------- 颜色特征提取 ----------
features:
  color_spaces:
    - "RGB"
    - "HSV"
    - "CIELAB"
    - "YCbCr"

  # 颜色矩 (每通道: mean, std, skewness, kurtosis)
  color_moments: true

  # 直方图特征
  histogram:
    enabled: true
    bins: 32                    # 直方图bins数
    percentiles: [10, 25, 50, 75, 90]  # 百分位数

  # 植被指数
  vegetation_indices:
    enabled: true
    indices:
      - "VARI"                  # Visible Atmospherically Resistant Index
      - "GLI"                   # Green Leaf Index
      - "ExG"                   # Excess Green
      - "ExR"                   # Excess Red
      - "ExGR"                  # ExG - ExR
      - "NGRDI"                 # Normalized Green-Red Difference Index
      - "DGCI"                  # Dark Green Color Index
      - "CIVE"                  # Color Index of Vegetation Extraction
      - "MGRVI"                 # Modified Green Red Vegetation Index
      - "RGBVI"                 # RGB-based Vegetation Index

  # 色度坐标
  chromaticity:
    enabled: true
    spaces:
      - "xyY"                   # CIE 1931
      - "uv"                    # CIE 1976 UCS
      - "Lab"                   # CIELAB (已包含在 color_spaces 中)

  # 纹理特征 (GLCM)
  texture:
    enabled: true
    distances: [1, 3, 5]       # 像素距离
    angles: [0, 45, 90, 135]   # 角度 (度)
    properties:
      - "contrast"
      - "dissimilarity"
      - "homogeneity"
      - "energy"
      - "correlation"
      - "ASM"

  # 叶片形状特征 (可选)
  shape:
    enabled: true
    features:
      - "area"
      - "perimeter"
      - "circularity"
      - "eccentricity"
      - "solidity"
      - "extent"
      - "major_axis_length"
      - "minor_axis_length"

# ---------- 输出格式 ----------
output:
  format: "csv"                 # csv | excel | json
  separate_visualization: false # 是否单独生成可视化报告
  save_raw_table: true          # 聚合时同时保存逐图原始表
  aggregate_cv: false           # CV 对带符号/近零性状不稳定，默认关闭
  write_manifest: true          # 保存配置哈希、版本和成功/失败计数
  phenotype_table_name: "leaf_color_phenotypes"
