# ============================================================
# 大白菜叶色表型提取 — 全局配置文件
# ============================================================

# ---------- 输入输出路径 ----------
input:
  image_dir: "./data/raw_images/"          # 原始图像目录
  colorchecker_dir: "./data/colorchecker/"  # 色卡参考图像目录
  output_dir: "./output/"                   # 结果输出目录
  model_dir: "./models/"                    # 预训练模型目录

# ---------- 成像参数 ----------
imaging:
  color_space: "sRGB"           # 目标颜色空间
  white_balance: "gray_card"    # 白平衡方法: gray_card | auto | fixed
  color_temperature: 6500       # 固定色温 (K), white_balance=fixed 时生效
  bits_per_channel: 16          # 输出位深 (8/16)

# ---------- 颜色校准 (X-Rite ColorChecker 24) ----------
color_calibration:
  enabled: true
  method: "polynomial"          # polynomial | linear | root_polynomial
  polynomial_degree: 2          # 多项式阶数
  # ColorChecker 24 在 D65 下的标准 CIE XYZ 参考值
  # 这些值需要根据实际使用的色卡型号校准
  reference_file: ""            # 留空则使用内置 ColorChecker24 参考值

# ---------- 叶片分割参数 ----------
segmentation:
  method: "auto"                # auto | unet | grabcut | exg_threshold | sam
  unet_model: "models/unet_efficientnet_b3.pth"
  device: "cuda"                # cuda | cpu
  # 传统方法参数
  exg_threshold: 0.15           # 超绿指数阈值 (method=exg_threshold)
  grabcut_iterations: 5         # GrabCut迭代次数 (method=grabcut)
  # 形态学后处理
  morph_kernel_size: 5          # 开/闭运算核大小
  min_leaf_area_ratio: 0.05     # 最小叶片面积占比（小于此值的连通域去除）

# ---------- 颜色特征提取 ----------
features:
  color_spaces:
    - "RGB"
    - "HSV"
    - "CIELAB"
    - "YCbCr"

  # 颜色矩 (每通道: mean, std, skewness, kurtosis)
  color_moments: true

  # 直方图特征
  histogram:
    enabled: true
    bins: 32                    # 直方图bins数
    percentiles: [10, 25, 50, 75, 90]  # 百分位数

  # 植被指数
  vegetation_indices:
    enabled: true
    indices:
      - "VARI"                  # Visible Atmospherically Resistant Index
      - "GLI"                   # Green Leaf Index
      - "ExG"                   # Excess Green
      - "ExR"                   # Excess Red
      - "ExGR"                  # ExG - ExR
      - "NGRDI"                 # Normalized Green-Red Difference Index
      - "DGCI"                  # Dark Green Color Index
      - "CIVE"                  # Color Index of Vegetation Extraction
      - "MGRVI"                 # Modified Green Red Vegetation Index
      - "RGBVI"                 # RGB-based Vegetation Index

  # 色度坐标
  chromaticity:
    enabled: true
    spaces:
      - "xyY"                   # CIE 1931
      - "uv"                    # CIE 1976 UCS
      - "Lab"                   # CIELAB (已包含在 color_spaces 中)

  # 纹理特征 (GLCM)
  texture:
    enabled: true
    distances: [1, 3, 5]       # 像素距离
    angles: [0, 45, 90, 135]   # 角度 (度)
    properties:
      - "contrast"
      - "dissimilarity"
      - "homogeneity"
      - "energy"
      - "correlation"
      - "ASM"

  # 叶片形状特征 (可选)
  shape:
    enabled: true
    features:
      - "area"
      - "perimeter"
      - "circularity"
      - "eccentricity"
      - "solidity"
      - "extent"
      - "major_axis_length"
      - "minor_axis_length"

# ---------- 输出格式 ----------
output:
  format: "csv"                 # csv | excel | json
  separate_visualization: true  # 是否单独生成可视化报告
  phenotype_table_name: "leaf_color_phenotypes"
